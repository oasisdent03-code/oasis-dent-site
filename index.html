<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Dent | Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00468b; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        
        /* Header بدون كلمة الأغواط */
        header { background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); sticky: top; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary); text-transform: uppercase; }

        /* شريط الأقسام الذي كنت تبحث عنه */
        .nav-categories { 
            background: #ffffff; 
            overflow-x: auto; 
            white-space: nowrap; 
            padding: 12px; 
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .nav-categories a { 
            display: inline-block; 
            padding: 8px 15px; 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: bold; 
            font-size: 13px; 
            background: #f0f0f0; 
            border-radius: 20px;
            border: 1px solid #eee;
        }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .section-title { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 40px; }

        /* المنتج المطللوب */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .price { color: #d9534f; font-size: 22px; font-weight: bold; margin: 15px 0; display: block; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* السلة السفلية */
        .cart-status { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; cursor: pointer; z-index: 1000; }

        /* نافذة الطلب */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal-content { background: white; max-width: 450px; margin: 40px auto; padding: 25px; border-radius: 12px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-send { background: var(--secondary); color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<header><div class="logo">Oasis Dent</div></header>

<div class="nav-categories">
    <a href="#Chirurgie">Chirurgie</a> <a href="#Anesthesie">Anesthesie</a> <a href="#Soin">Soin</a>
    <a href="#Endodontie">Endodontie</a> <a href="#Composite">Composite</a> <a href="#Finition">Finition</a>
    <a href="#ODF">O.D.F</a> <a href="#Desinfectant">Desinfectant</a> <a href="#Champs">Champs</a> <a href="#Instruments">Instruments</a>
</div>

<div class="container">
    <section id="Composite">
        <h2 class="section-title">Composite</h2>
        <div class="grid">
            <div class="card">
                <h3>ZirconFill</h3>
                <span class="price">2950 DA</span>
                <button class="btn-add" onclick="addToCart('ZirconFill', 2950)">Ajouter au panier</button>
            </div>
        </div>
    </section>
</div>

<div class="cart-status" id="cart-status" style="display:none;" onclick="showForm()">
    🛒 Voir le panier (<span id="count">0</span>) - <span id="total">0</span> DA
</div>

<div id="modal">
    <div class="modal-content">
        <h3>Détails de la commande</h3>
        <p id="summary" style="background:#f9f9f9; padding:10px; border-radius:5px; font-size:14px;"></p>
        <input type="text" id="name" placeholder="Nom et Prénom" required>
        <input type="text" id="wilaya" placeholder="Wilaya" required>
        <input type="tel" id="phone" placeholder="Numéro de téléphone" required>
        <select id="deliv">
            <option value="Bureau">Bureau (Yalidine/Nord-Sud)</option>
            <option value="Domicile">À Domicile</option>
        </select>
        <button class="btn-send" id="btn-submit" onclick="sendOrder()">Confirmer la commande</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Annuler</button>
    </div>
</div>

<script>
    // بيانات الربط الخاصة بك
    const SB_URL = "https://lkmydwmspoghkwdhnnh.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxreW15ZHdtc3BvZ2hrd2Robm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIzNzcsImV4cCI6MjA5MzgzODM3N30.CIMxmajrFjJ8KNrSqF_ifr1C13XUfOEk7_a2JV_yfqA";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let cart = [];

    function addToCart(name, price) {
        cart.push({name, price});
        updateCart();
    }

    function updateCart() {
        const count = cart.length;
        const total = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('count').innerText = count;
        document.getElementById('total').innerText = total;
        document.getElementById('cart-status').style.display = count > 0 ? 'block' : 'none';
    }

    function showForm() {
        document.getElementById('modal').style.display = 'block';
        document.getElementById('summary').innerText = "Produits: " + cart.map(i => i.name).join(', ');
    }

    async function sendOrder() {
        const n = document.getElementById('name').value;
        const w = document.getElementById('wilaya').value;
        const p = document.getElementById('phone').value;
        const d = document.getElementById('deliv').value;

        if(!n || !w || !p) { alert("Remplir les champs!"); return; }

        const btn = document.getElementById('btn-submit');
        btn.innerText = "Envoi...";
        btn.disabled = true;

        const { error } = await supabaseClient.from('orders').insert([{
            customer_name: n, wilaya: w, phone: p, delivery_type: d,
            items: cart.map(i => i.name).join(', '),
            total_price: cart.reduce((s, i) => s + i.price, 0)
        }]);

        if(error) {
            alert("Erreur: " + error.message);
            btn.disabled = false;
        } else {
            alert("Commande reçue! Merci.");
            cart = []; updateCart();
            document.getElementById('modal').style.display = 'none';
            btn.disabled = false; btn.innerText = "Confirmer la commande";
        }
