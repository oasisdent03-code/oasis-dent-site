<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Dent | Boutique Officielle</title>
    <style>
        :root { --primary: #00468b; --secondary: #25d366; --bg: #f5f7fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 100px; }
        header { background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary); sticky: top; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary); }

        .nav-scroll { background: white; overflow-x: auto; white-space: nowrap; padding: 10px; border-bottom: 1px solid #ddd; }
        .nav-scroll a { display: inline-block; padding: 8px 15px; text-decoration: none; color: var(--primary); font-weight: bold; font-size: 14px; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .section-title { background: var(--primary); color: white; padding: 10px 20px; border-radius: 5px; margin-top: 30px; }

        /* Products */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: white; border-radius: 8px; padding: 15px; text-align: center; border: 1px solid #eee; }
        .price { color: #d9534f; font-weight: bold; display: block; margin: 10px 0; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; width: 100%; }

        /* Floating Cart Button */
        .cart-status { position: fixed; bottom: 20px; right: 20px; background: var(--secondary); color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: bold; z-index: 1000; }

        /* Checkout Modal */
        #checkout-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; overflow-y: auto; }
        .modal-content { background: white; max-width: 500px; margin: 50px auto; padding: 25px; border-radius: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-send { background: var(--secondary); color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<header><div class="logo">Oasis Dent</div></header>

<div class="nav-scroll">
    <a href="#Chirurgie">Chirurgie</a> <a href="#Anesthesie">Anesthesie</a> <a href="#Soin">Soin</a>
    <a href="#Endodontie">Endodontie</a> <a href="#Composite">Composite</a> <a href="#Finition">Finition</a>
    <a href="#ODF">O.D.F</a> <a href="#Desinfectant">Desinfectant</a> <a href="#Champs">Champs</a> <a href="#Instruments">Instruments</a>
</div>

<div class="container">
    <section id="Composite">
        <h2 class="section-title">Composite</h2>
        <div class="grid">
            <div class="card">
                <strong>ZirconFill</strong>
                <span class="price">2950 DA</span>
                <button class="btn-add" onclick="addToCart('ZirconFill', 2950)">Ajouter au panier</button>
            </div>
        </div>
    </section>

    </div>

<div class="cart-status" onclick="openCheckout()">🛒 Panier (<span id="cart-count">0</span>)</div>

<div id="checkout-modal">
    <div class="modal-content">
        <h3>Finaliser la commande</h3>
        <div id="cart-items-list" style="margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;"></div>
        <input type="text" id="nom" placeholder="Nom et Prénom" required>
        <input type="text" id="wilaya" placeholder="Wilaya" required>
        <input type="tel" id="phone" placeholder="Numéro de téléphone" required>
        <select id="delivery">
            <option value="Bureau">Livraison au Bureau</option>
            <option value="Domicile">Livraison à Domicile</option>
        </select>
        <button class="btn-send" onclick="sendToWhatsApp()">Envoyer la commande (WhatsApp)</button>
        <button onclick="closeModal()" style="background: none; border: none; color: red; cursor: pointer; width: 100%; margin-top: 10px;">Annuler</button>
    </div>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        cart.push({name, price});
        document.getElementById('cart-count').innerText = cart.length;
        alert(name + " ajouté au panier !");
    }

    function openCheckout() {
        if(cart.length === 0) { alert("Le panier est vide !"); return; }
        document.getElementById('checkout-modal').style.display = 'block';
        let list = cart.map(item => "- " + item.name + " (" + item.price + " DA)").join('<br>');
        document.getElementById('cart-items-list').innerHTML = "<strong>Produits:</strong><br>" + list;
    }

    function closeModal() { document.getElementById('checkout-modal').style.display = 'none'; }

    function sendToWhatsApp() {
        let nom = document.getElementById('nom').value;
        let wilaya = document.getElementById('wilaya').value;
        let phone = document.getElementById('phone').value;
        let delivery = document.getElementById('delivery').value;

        if(!nom || !wilaya || !phone) { alert("Veuillez remplir tous les champs !"); return; }

        let productList = cart.map(item => "- " + item.name).join('%0A');
        let total = cart.reduce((sum, item) => sum + item.price, 0);

        let message = `Bonsoir Oasis Dent, je souhaite commander:%0A${productList}%0A%0A*Total:* ${total} DA%0A%0A*Infos Client:*%0A- Nom: ${nom}%0A- Wilaya: ${wilaya}%0A- Tél: ${phone}%0A- Livraison: ${delivery}`;
        
        window.open(`https://wa.me/213660336879?text=${message}`);
    }
</script>

</body>
</html>
