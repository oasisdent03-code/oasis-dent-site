
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Dent | Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #00468b; --s: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; padding-bottom: 80px; }
        header { background: white; padding: 15px; text-align: center; border-bottom: 3px solid var(--p); position: sticky; top: 0; z-index: 100; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .price { color: #d9534f; font-size: 1.3em; font-weight: bold; display: block; margin: 10px 0; }
        .btn { background: var(--p); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: var(--s); color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 1000; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; }
        .m-content { background: white; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .total-box { background: #e9ecef; padding: 10px; border-radius: 8px; margin: 10px 0; font-weight: bold; color: var(--p); text-align: center; }
        .confirm-btn { background: var(--s); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header><div style="font-size: 26px; font-weight: bold; color: var(--p);">Oasis Dent</div></header>

<div class="container">
    <div class="grid">
        <div class="card">
            <strong>ZirconFill</strong>
            <span class="price">2950 DA</span>
            <button class="btn" onclick="addToCart('ZirconFill', 2950)">🛒 Ajouter au panier</button>
        </div>
    </div>
</div>

<div class="cart-btn" onclick="openModal()">🛒 Panier (<span id="count">0</span>)</div>

<div id="modal">
    <div class="m-content">
        <h3 style="margin-top:0">Votre Commande</h3>
        <div id="items-list" style="background:#f0f2f5; padding:10px; border-radius:8px; font-size:0.9em;"></div>
        <div class="total-box">Total: <span id="total-val">0</span> DA</div>

        <input type="text" id="c_name" placeholder="Nom et Prénom" required>
        <input type="tel" id="c_phone" placeholder="N° de Téléphone" required>
        
        <select id="c_delivery">
            <option value="Noest">Noest</option>
            <option value="Swift">Swift</option>
        </select>

        <select id="c_type" onchange="toggleCommune()">
            <option value="Bureau">Livraison Bureau</option>
            <option value="Domicile">Livraison à Domicile</option>
        </select>

        <select id="c_wilaya" onchange="updateCommunes()">
            <option value="">Sélectionnez la Wilaya</option>
        </select>

        <div id="commune-div" style="display:none;">
            <select id="c_commune">
                <option value="">Sélectionnez la Commune</option>
            </select>
        </div>
        
        <button class="confirm-btn" onclick="submitOrder()">✅ Confirmer</button>
        <button onclick="closeModal()" style="background:none; border:none; color:red; width:100%; margin-top:10px; cursor:pointer;">Annuler</button>
    </div>
</div>

<script>
    // بيانات الولايات والبلديات (أمثلة لضمان عمل الكود، يمكنك إضافة المزيد)
    const dataDZ = {
        "01 Adrar": ["Adrar", "Fenoughil", "Reggane"],
        "03 Laghouat": ["Laghouat", "Aflou", "Ain Madhi", "Hassi R'Mel"],
        "16 Alger": ["Alger Centre", "Bab El Oued", "Zeralda", "Hydra"],
        "31 Oran": ["Oran", "Es Senia", "Arzew"],
        // أضف بقية الولايات والبلديات هنا بنفس الطريقة
    };

    // ملء الولايات عند التشغيل
    const selW = document.getElementById('c_wilaya');
    for (let w in dataDZ) {
        let opt = document.createElement('option');
        opt.value = w; opt.text = w; selW.appendChild(opt);
    }

    function toggleCommune() {
        const type = document.getElementById('c_type').value;
        document.getElementById('commune-div').style.display = (type === "Domicile") ? "block" : "none";
    }

    function updateCommunes() {
        const w = document.getElementById('c_wilaya').value;
        const selC = document.getElementById('c_commune');
        selC.innerHTML = '<option value="">Sélectionnez la Commune</option>';
        if (dataDZ[w]) {
            dataDZ[w].forEach(c => {
                let opt = document.createElement('option');
                opt.value = c; opt.text = c; selC.appendChild(opt);
            });
        }
    }

    const S_URL = "https://lkmydwmspoghkwdhnnh.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxreW15ZHdtc3BvZ2hrd2Robm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIzNzcsImV4cCI6MjA5MzgzODM3N30.CIMxmajrFjJ8KNrSqF_ifr1C13XUfOEk7_a2JV_yfqA" ***
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let cart = [];
    function addToCart(n, p) { cart.push({n, p}); document.getElementById('count').innerText = cart.length; alert(n + " ajouté!"); }
    
    function openModal() {
        if(cart.length==0) return alert("Panier vide!");
        document.getElementById('modal').style.display='block';
        document.getElementById('items-list').innerHTML = cart.map(i=> "• " + i.n + " ("+i.p+" DA)").join("<br>");
        document.getElementById('total-val').innerText = cart.reduce((s, i)=> s + i.p, 0);
    }

    function closeModal() { document.getElementById('modal').style.display='none'; }

    async function submitOrder() {
        const data = {
            customer_name: document.getElementById('c_name').value,
            phone: document.getElementById('c_phone').value,
            wilaya: document.getElementById('c_wilaya').value,
            commune: document.getElementById('c_commune').value || "N/A",
            delivery_type: document.getElementById('c_delivery').value + " (" + document.getElementById('c_type').value + ")",
            items: cart.map(i=>i.n).join(", "),
            total_price: cart.reduce((s, i)=>s+i.p, 0)
        };
        
        if(!data.customer_name || !data.phone || !data.wilaya) return alert("Remplir les champs!");

        const { error } = await _supabase.from('orders').insert([data]);
        if (error) alert("Erreur: " + error.message);
        else { alert("✅ Commande reçue!"); cart=[]; location.reload(); }
    }
</script>
</body>
</html>
