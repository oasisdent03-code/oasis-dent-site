<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Dent | Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #00468b; --s: #25d366; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); scroll-behavior: smooth; }
        
        /* الترويسة */
        header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--p); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: var(--p); }

        /* واجهة الأقسام (Menu) */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .cat-card { background: white; border-radius: 15px; overflow: hidden; text-align: center; border: 1px solid #ddd; transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .cat-card:hover { transform: translateY(-5px); border-color: var(--p); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .cat-card img { width: 100%; height: 90px; object-fit: cover; background: #eee; }
        .cat-card span { display: block; padding: 10px; font-weight: bold; font-size: 13px; }

        /* المنتجات */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .section-title { color: var(--p); border-left: 5px solid var(--p); padding-left: 10px; margin: 40px 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
        .price { color: #d9534f; font-size: 1.3em; font-weight: bold; display: block; margin: 15px 0; }
        
        /* الأزرار */
        .btn-p { background: var(--p); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn-s { background: var(--s); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; }
        
        /* النوافذ المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; overflow-y: auto; }
        .m-content { background: white; max-width: 420px; margin: 50px auto; padding: 30px; border-radius: 20px; box-sizing: border-box; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .cart-btn { position: fixed; bottom: 25px; right: 25px; background: var(--s); color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header>
    <div class="logo">Oasis Dent</div>
    <div id="user-info" style="font-size: 12px; color: #666;">Visiteur</div>
</header>

<div class="container">
    <h3 style="margin-top:20px; color:var(--p)">Menu Principal</h3>
    <div class="categories-grid">
        <a href="#Composite" class="cat-card">
            <img src="https://placehold.co/300x200/00468b/white?text=Composite" alt="Composite">
            <span>Composite</span>
        </a>
        <a href="#Chirurgie" class="cat-card">
            <img src="https://placehold.co/300x200/00468b/white?text=Chirurgie" alt="Chirurgie">
            <span>Chirurgie</span>
        </a>
        <a href="#Instruments" class="cat-card">
            <img src="https://placehold.co/300x200/00468b/white?text=Instruments" alt="Instruments">
            <span>Instruments</span>
        </a>
        <a href="#Soin" class="cat-card">
            <img src="https://placehold.co/300x200/00468b/white?text=Soin" alt="Soin">
            <span>Soin</span>
        </a>
    </div>

    <h2 id="Composite" class="section-title">Composite</h2>
    <div class="grid">
        <div class="card">
            <strong>ZirconFill</strong>
            <span class="price">2950 DA</span>
            <button class="btn-p" onclick="checkUserBeforeAdd('ZirconFill', 2950)">🛒 Ajouter au panier</button>
        </div>
    </div>
</div>

<div class="cart-btn" onclick="openCart()">🛒 Panier (<span id="count">0</span>)</div>

<div id="auth-modal" class="modal">
    <div class="m-content">
        <h2 style="color:var(--p); text-align:center; margin-top:0;">Compte Requis</h2>
        <p style="text-align:center; font-size:14px; color:#666;">Veuillez créer un compte ou vous connecter pour commander.</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button class="btn-p" onclick="login()">Se connecter</button>
        <button class="btn-p" style="background:#6c757d; margin-top:10px;" onclick="signUp()">S'inscrire (Nouveau)</button>
        <button onclick="closeAuth()" style="background:none; border:none; color:red; width:100%; margin-top:15px; cursor:pointer;">Annuler</button>
    </div>
</div>

<div id="cart-modal" class="modal">
    <div class="m-content">
        <h3 style="margin-top:0; color:var(--p)">Finaliser la commande</h3>
        <div id="items-list" style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:15px; font-size:14px;"></div>
        
        <label>Transporteur:</label>
        <select id="c_transport">
            <option value="Noest">Noest</option>
            <option value="Swift">Swift</option>
        </select>

        <select id="c_type" onchange="toggleHomeFields()">
            <option value="Bureau">Retrait au Bureau</option>
            <option value="Domicile">Livraison à Domicile</option>
        </select>

        <select id="c_wilaya"><option value="">Sélectionnez la Wilaya</option></select>
        
        <div id="home-fields" style="display:none;">
            <input type="text" id="c_commune" placeholder="Nom de la Commune">
            <textarea id="c_addr" placeholder="Adresse précise ou Lieu-dit"></textarea>
        </div>
        
        <button class="btn-s" onclick="submitOrder()">✅ Confirmer l'achat</button>
        <button onclick="closeCart()" style="background:none; border:none; color:#999; width:100%; margin-top:15px; cursor:pointer;">Retour au magasin</button>
    </div>
</div>

<script>
    // --- إعدادات Supabase ---
    const S_URL = "https://lkmydwmspoghkwdhnnh.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxreW15ZHdtc3BvZ2hrd2Robm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIzNzcsImV4cCI6MjA5MzgzODM3N30.CIMxmajrFjJ8KNrSqF_ifr1C13XUfOEk7_a2JV_yfqA"
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let cart = [];

    // وظيفة التحقق من المستخدم قبل الإضافة للسلة
    async function checkUserBeforeAdd(name, price) {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) {
            document.getElementById('auth-modal').style.display = 'block';
        } else {
            addToCart(name, price);
        }
    }

    function addToCart(n, p) {
        cart.push({n, p});
        document.getElementById('count').innerText = cart.length;
        alert(n + " ajouté au panier !");
    }

    // وظائف تسجيل الدخول
    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password: pass });
        if (error) alert(error.message); else { closeAuth(); location.reload(); }
    }

    async function signUp() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const { error } = await _supabase.auth.signUp({ email, password: pass });
        if (error) alert(error.message); else alert("Vérifiez vos emails pour confirmer !");
    }

    function closeAuth() { document.getElementById('auth-modal').style.display='none'; }
    function openCart() { 
        if(cart.length==0) return alert("Votre panier est vide !");
        document.getElementById('cart-modal').style.display='block';
        document.getElementById('items-list').innerHTML = cart.map(i=> "🔹 " + i.n + " ("+i.p+" DA)").join("<br>");
    }
    function closeCart() { document.getElementById('cart-modal').style.display='none'; }
    function toggleHomeFields() { document.getElementById('home-fields').style.display = (document.getElementById('c_type').value === 'Domicile') ? 'block' : 'none'; }

    // تعبئة الـ 69 ولاية
    const wilayas = ["01 Adrar","02 Chlef","03 Laghouat","04 Oum El Bouaghi","05 Batna","06 Béjaïa","07 Biskra","08 Béchar","09 Blida","10 Bouira","11 Tamanrasset","12 Tébessa","13 Tlemcen","14 Tiaret","15 Tizi Ouzou","16 Alger","17 Djelfa","18 Jijel","19 Sétif","20 Saïda","21 Skikda","22 Sidi Bel Abbès","23 Annaba","24 Guelma","25 Constantine","26 Médéa","27 Mostaganem","28 M'Sila","29 Mascara","30 Ouargla","31 Oran","32 El Bayadh","33 Illizi","34 Bordj Bou Arreridj","35 Boumerdès","36 El Tarf","37 Tindouf","38 Tissemsilt","39 El Oued","40 Khenchela","41 Souk Ahras","42 Tipaza","43 Mila","44 Aïn Defla","45 Naâma","46 Aïn Témouchent","47 Ghardaïa","48 Relizane","49 El M'Ghair","50 El Meniaâ","51 Ouled Djellal","52 Bordj Baji Mokhtar","53 Béni Abbès","54 Timimoun","55 Touggourt","56 Djanet","57 In Salah","58 In Guezzam","59 El Meghaïer","60 El Menia","61 Ouled Djellal","62 Bordj Baji Mokhtar","63 Béni Abbès","64 Timimoun","65 Touggourt","66 Djanet","67 In Salah","68 In Guezzam","69 Wilaya Nouvelle"];
    const selW = document.getElementById('c_wilaya');
    wilayas.forEach(w => { let o = document.createElement('option'); o.value = w; o.text = w; selW.appendChild(o); });

    // إرسال الطلب
    async function submitOrder() {
        const { data: { user } } = await _supabase.auth.getUser();
        const data = {
            customer_email: user.email,
            wilaya: document.getElementById('c_wilaya').value,
            commune: document.getElementById('c_commune').value || "Retrait Bureau",
            address: document.getElementById('c_addr').value || "N/A",
            delivery_details: document.getElementById('c_transport').value + " (" + document.getElementById('c_type').value + ")",
            items: cart.map(i=>i.n).join(", "),
            total_price: cart.reduce((s, i)=> s + i.p, 0)
        };
        if(!data.wilaya) return alert("Veuillez choisir la wilaya !");
        
        const { error } = await _supabase.from('orders').insert([data]);
        if(error) alert(error.message); else { alert("✅ Commande reçue !"); cart=[]; location.reload(); }
    }

    // تحديث ترويسة الموقع باسم المستخدم
    async function updateUI() {
        const { data: { user } } = await _supabase.auth.getUser();
        if(user) document.getElementById('user-info').innerText = "Email: " + user.email;
    }
    updateUI();
</script>
</body>
</html>
