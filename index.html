<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Dent | Boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #00468b; --s: #25d366; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); scroll-behavior: smooth; }
        header { background: white; padding: 15px; text-align: center; border-bottom: 3px solid var(--p); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; color: var(--p); text-transform: uppercase; }
        
        /* قائمة الأقسام بالصور */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .menu-item { background: white; border-radius: 12px; overflow: hidden; text-align: center; border: 1px solid #ddd; text-decoration: none; color: inherit; transition: 0.3s; }
        .menu-item:hover { transform: translateY(-3px); border-color: var(--p); }
        .menu-item img { width: 100%; height: 90px; object-fit: cover; background: #eee; }
        .menu-item span { display: block; padding: 10px; font-weight: bold; font-size: 13px; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .section-title { color: var(--p); border-left: 5px solid var(--p); padding-left: 10px; margin: 40px 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .price { color: #d9534f; font-size: 1.3em; font-weight: bold; display: block; margin: 15px 0; }
        
        .btn-p { background: var(--p); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; }
        .m-content { background: white; max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: var(--s); color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header><div class="logo">Oasis Dent</div></header>

<div class="container">
    <div class="menu-grid">
        <a href="#Composite" class="menu-item">
            <img src="https://placehold.co/300x200/00468b/white?text=Composite" alt="Composite">
            <span>Composite</span>
        </a>
        <a href="#Chirurgie" class="menu-item">
            <img src="https://placehold.co/300x200/00468b/white?text=Chirurgie" alt="Chirurgie">
            <span>Chirurgie</span>
        </a>
    </div>

    <h2 id="Composite" class="section-title">Composite</h2>
    <div class="grid">
        <div class="card">
            <strong>ZirconFill</strong>
            <span class="price">2950 DA</span>
            <button class="btn-p" onclick="handlePurchase('ZirconFill', 2950)">🛒 Ajouter au panier</button>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="m-content">
        <h2 style="text-align:center; color:var(--p)">Créer un compte</h2>
        <p style="text-align:center; font-size:14px;">Identifiez-vous pour commander.</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button class="btn-p" onclick="signUp()">S'inscrire et continuer</button>
        <button onclick="closeAuth()" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Annuler</button>
    </div>
</div>

<script>
    const S_URL = "https://lkmydwmspoghkwdhnnh.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxreW15ZHdtc3BvZ2hrd2Robm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIzNzcsImV4cCI6MjA5MzgzODM3N30.CIMxmajrFjJ8KNrSqF_ifr1C13XUfOEk7_a2JV_yfqA"; 
    const _supabase = supabase.createClient(S_URL, S_KEY);

    async function handlePurchase(name, price) {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) {
            document.getElementById('auth-modal').style.display = 'block';
        } else {
            alert(name + " ajouté au panier !");
        }
    }

    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await _supabase.auth.signUp({ email, password });
        if (error) alert(error.message); else alert("Compte créé ! Vérifiez vos emails.");
    }

    function closeAuth() { document.getElementById('auth-modal').style.display='none'; }
</script>
</body>
</html>
